name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean build
        run: bash ./gradlew clean --no-daemon --no-build-cache

      - name: Build Debug APK
        run: bash ./gradlew :android:assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Run Unit Tests
        run: bash ./gradlew :core:test --no-daemon --stacktrace --no-build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean build
        run: bash ./gradlew clean --no-daemon --no-build-cache

      - name: Run Android Lint
        run: bash ./gradlew :android:lintDebug --no-daemon --stacktrace --no-build-cache

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/build/reports/lint-results-debug.html
          retention-days: 7
